name: Release gates
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/test_patch_runtime.py
      - run: python3 scripts/validate_patch_runtime.py
      - run: ./gradlew test lintRelease publishAll
      - run: python3 scripts/validate_patch_runtime.py --aar bugcapsule-patch/build/outputs/aar/bugcapsule-patch-release.aar
      - run: sh bugcapsule-ndk/src/test/native/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maven-candidates
          path: build/repo
