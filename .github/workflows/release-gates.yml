name: Release gates
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/test_patch_runtime.py
      - run: python3 scripts/validate_patch_runtime.py
      - run: ./gradlew test lintRelease publishAll
      - run: python3 scripts/validate_patch_runtime.py --aar bugcapsule-patch/build/outputs/aar/bugcapsule-patch-release.aar
      - run: sh bugcapsule-ndk/src/test/native/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maven-candidates
          path: build/repo
  # BC-ENT-034: instrumentation tests on emulators (patch runtime, demo app).
  emulator:
    name: Instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and test APKs
        run: ./gradlew :bugcapsule-patch:assembleDebugAndroidTest :demo:assembleDebug :demo:assembleDebugAndroidTest
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          # The runner's own animation settings ran before the API 29
          # settings service was up ("Broken pipe") and failed the job before
          # any test; scripts/emulator_ready.sh waits for boot and retries.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            sh scripts/emulator_ready.sh
            ./gradlew :bugcapsule-patch:connectedDebugAndroidTest :demo:connectedDebugAndroidTest --continue
      - name: Report test, failure and skip counts
        if: always()
        run: python3 scripts/instrumentation_summary.py bugcapsule-patch examples/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: |
            bugcapsule-patch/build/outputs/androidTest-results/
            bugcapsule-patch/build/reports/androidTests/
            examples/demo/build/outputs/androidTest-results/
            examples/demo/build/reports/androidTests/
